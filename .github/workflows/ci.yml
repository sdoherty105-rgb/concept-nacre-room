name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build-test:
    name: Build, test, Lighthouse (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build (Next.js)
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (pages, noindex, concept label, demo-only form)
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Build for Cloudflare Workers (OpenNext, no deploy)
        run: npm run cf:build

      - name: Lighthouse CI (mobile)
        run: npx lhci autorun

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            playwright-report
            test-results
            .lighthouseci
          if-no-files-found: ignore
          retention-days: 14
